<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Dokumentasi Kegiatan - PMR SPENSAMO</title>
    
    <!-- PWA & Mobile Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#b00020">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="PMR SPENSAMO">
    <link rel="apple-touch-icon" href="https://yanuar-moga.github.io/pmr/assets/logo.png">
    
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-red: #b00020;
            --primary-gradient: linear-gradient(135deg, #b00020 0%, #e53935 100%);
            --bg-light: #f8fafc;
            --card-bg: #ffffff;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border-radius-lg: 24px;
            --border-radius-md: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            min-height: 100vh;
            padding: 24px 16px;
            display: flex;
            justify-content: center;
        }

        .wrapper {
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
        }

        /* Top Navigation Bar / Kop Header */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 8px 0;
        }

        .brand-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .brand-logo {
            width: 58px;
            height: 58px;
            object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(176, 0, 32, 0.15));
        }

        .brand-text h1 {
            font-size: 20px;
            font-weight: 800;
            color: var(--primary-red);
            line-height: 1.15;
            letter-spacing: -0.3px;
        }

        .brand-text p {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
            margin-top: 3px;
        }

        /* Tombol Kembali ke Beranda */
        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: #ffebee;
            color: var(--primary-red);
            border: 1px solid rgba(176, 0, 32, 0.15);
            font-size: 13px;
            font-weight: 700;
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-back:hover {
            background-color: #ffcdd2;
            transform: translateX(-2px);
        }

        /* Hero Header Banner (Menampilkan Judul Kegiatan) */
        .hero-banner {
            background: var(--primary-gradient);
            color: #ffffff;
            padding: 24px 20px;
            border-radius: var(--border-radius-lg);
            margin-bottom: 20px;
            box-shadow: 0 12px 28px -6px rgba(176, 0, 32, 0.35);
        }

        .hero-banner h2 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .hero-banner p {
            font-size: 13px;
            color: #ffebee;
            font-weight: 400;
            opacity: 0.95;
        }

        /* Container iFrame & Loading */
        .iframe-card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius-lg);
            padding: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .iframe-container {
            position: relative;
            width: 100%;
            height: 72vh; /* Dioptimalkan agar muat di layar HP/Desktop */
            border-radius: var(--border-radius-md);
            overflow: hidden;
            background-color: #f1f5f9;
        }

        .frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Loading Spinner Animation */
        .loading-state {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        .spinner {
            width: 38px;
            height: 38px;
            border: 4px solid #ffebee;
            border-top: 4px solid var(--primary-red);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 16px 0;
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Responsive Breakpoint */
        @media (max-width: 480px) {
            body {
                padding: 16px 12px;
            }

            .brand-logo {
                width: 48px;
                height: 48px;
            }

            .brand-text h1 {
                font-size: 17px;
            }

            .brand-text p {
                font-size: 11px;
            }

            .btn-back {
                padding: 6px 12px;
                font-size: 12px;
            }

            .hero-banner {
                padding: 20px 16px;
                border-radius: 20px;
            }

            .hero-banner h2 {
                font-size: 18px;
            }

            .iframe-card {
                padding: 8px;
                border-radius: 20px;
            }

            .iframe-container {
                height: 70vh;
            }
        }
    </style>
</head>

<body>

<div class="wrapper">

    <!-- Header / Kop -->
    <header class="top-bar">
        <div class="brand-info">
            <img src="https://yanuar-moga.github.io/pmr/assets/logo.png" alt="Logo PMR SPENSAMO" class="brand-logo" onerror="this.src='https://via.placeholder.com/58?text=PMR'">
            <div class="brand-text">
                <h1>PMR SPENSAMO</h1>
                <p>Arsip & Galeri Digital</p>
            </div>
        </div>
        <a href="index.html" class="btn-back">
            <span>‹</span> Beranda
        </a>
    </header>

    <!-- Banner Judul Kegiatan (Dinamis via URL Parameter) -->
    <section class="hero-banner">
        <h2 id="judul">Arsip Google Drive</h2>
        <p>Dokumentasi resmi dan berkas kegiatan PMR SPENSAMO</p>
    </section>

    <!-- Card Wrapper untuk iFrame Google Drive -->
    <main class="iframe-card">
        <div class="iframe-container">
            <!-- Loading State Animation -->
            <div id="loading" class="loading-state">
                <div class="spinner"></div>
                <span class="loading-text">Memuat berkas Drive...</span>
            </div>

            <!-- iFrame Embed -->
            <iframe id="frame" class="frame" title="Galeri Drive"></iframe>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; PMR Madya SMP Negeri 1 Moga. All rights reserved.</p>
    </footer>

</div>

<script>
    // 1. Ambil Parameter Judul & Src dari URL
    const params = new URLSearchParams(window.location.search);
    const judulParam = params.get("judul");
    const srcParam = params.get("src");

    const judulEl = document.getElementById("judul");
    const frameEl = document.getElementById("frame");
    const loadingEl = document.getElementById("loading");
    const pageTitleEl = document.getElementById("page-title");

    // 2. Set Judul Dinamis
    if (judulParam) {
        judulEl.innerText = judulParam;
        pageTitleEl.innerText = `${judulParam} - PMR SPENSAMO`;
    }

    // 3. Set Source iFrame & Handle Loading Animation
    if (srcParam) {
        frameEl.src = srcParam;
        
        // Sembunyikan spinner ketika iFrame selesai dimuat
        frameEl.onload = function() {
            loadingEl.style.opacity = '0';
            setTimeout(() => {
                loadingEl.style.display = 'none';
            }, 300);
        };
    } else {
        loadingEl.innerHTML = '<span class="loading-text" style="color: var(--primary-red);">⚠️ Berkas tidak ditemukan atau tautan tidak valid.</span>';
    }

    // 4. Registrasi Service Worker PWA
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('Service Worker terdaftar:', reg))
                .catch(err => console.error('Gagal daftar Service Worker:', err));
        });
    }
</script>

</body>
</html>
