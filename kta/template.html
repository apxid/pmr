<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>KTA PMR Madya - SMP Negeri 1 Moga</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #f7eeee,
          #ffffff
        );

      color: #351015;

    }


    .page {

      min-height: 100vh;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      padding: 20px;

    }


    .loading {

      text-align: center;

      color: #8a6d71;

      font-size: 14px;

    }


    .spinner {

      width: 42px;

      height: 42px;

      margin: 0 auto 14px;

      border-radius: 50%;

      border:
        4px solid #f0d5d8;

      border-top-color:
        #bd081c;

      animation:
        spin .8s linear infinite;

    }


    @keyframes spin {

      to {
        transform: rotate(360deg);
      }

    }


    .error {

      width:
        min(100%, 430px);

      background: white;

      border-radius: 20px;

      padding: 25px;

      text-align: center;

      box-shadow:
        0 18px 50px
        rgba(60, 10, 20, .12);

    }


    .error-icon {

      font-size: 42px;

      margin-bottom: 10px;

    }


    .error h2 {

      margin: 0 0 8px;

      color: #9b1422;

      font-size: 19px;

    }


    .error p {

      margin: 0;

      color: #745f63;

      font-size: 13px;

      line-height: 1.5;

    }


    /* =====================================================
       KTA CARD
    ===================================================== */


    .kta-stage {

      width: 100%;

      display: flex;

      justify-content: center;

      padding: 12px 0 22px;

    }


    .kta-card {

      position: relative;

      width:
        min(100%, 360px);

      aspect-ratio:
        5.513 / 8.72;

      overflow: hidden;

      border-radius: 20px;

      background:
        linear-gradient(
          155deg,
          #ffffff 0%,
          #fff8f8 45%,
          #fce5e7 100%
        );

      box-shadow:
        0 20px 50px
        rgba(65, 10, 18, .22);

      border:
        1px solid
        rgba(189, 8, 28, .16);

    }


    /* =====================================================
       TOP MERAH
    ===================================================== */


    .kta-top {

      position: absolute;

      left: 0;
      right: 0;
      top: 0;

      height: 18.5%;

      background:
        linear-gradient(
          135deg,
          #8f0016 0%,
          #bd081c 55%,
          #e1273d 100%
        );

      clip-path:
        polygon(
          0 0,
          100% 0,
          100% 77%,
          50% 100%,
          0 77%
        );

    }


    /* =====================================================
       ORGANISASI
    ===================================================== */


    .kta-org {

      position: absolute;

      top: 4.5%;

      left: 8%;
      right: 8%;

      z-index: 5;

      color: white;

      text-align: center;

      font-size: 9px;

      line-height: 1.25;

      font-weight: 800;

    }


    .kta-org strong {

      display: block;

      font-size: 11px;

      font-weight: 900;

    }


    .kta-cross {

      width: 24px;
      height: 24px;

      margin: 5px auto 0;

      display: flex;

      align-items: center;

      justify-content: center;

      background: white;

      border-radius: 7px;

      color: #bd081c;

      font-size: 16px;

      font-weight: 900;

      box-shadow:
        0 3px 10px
        rgba(0,0,0,.10);

    }


    /* =====================================================
       FOTO
    ===================================================== */


    .kta-photo-wrap {

      position: absolute;

      z-index: 4;

      top: 22%;

      left: 50%;

      transform:
        translateX(-50%);

      width: 43%;

      aspect-ratio: 3 / 4;

      padding: 4px;

      border-radius: 14px;

      background:
        linear-gradient(
          145deg,
          #8f0016,
          #e1263d
        );

      box-shadow:
        0 9px 22px
        rgba(80,0,15,.20);

    }


    .kta-photo {

      display: block;

      width: 100%;
      height: 100%;

      object-fit: cover;

      object-position:
        center center;

      border-radius: 10px;

      background: #eeeeee;

    }


    /* =====================================================
       BODY
    ===================================================== */


    .kta-body {

      position: absolute;

      z-index: 5;

      left: 7%;
      right: 7%;

      top: 55.5%;

      text-align: center;

    }


    .kta-label {

      font-size: 8px;

      text-transform: uppercase;

      letter-spacing: 1.6px;

      color: #9c7b80;

      font-weight: 900;

    }


    .kta-name {

      margin-top: 5px;

      font-size:
        clamp(
          14px,
          4vw,
          19px
        );

      line-height: 1.15;

      color: #3b1117;

      font-weight: 900;

      word-break: break-word;

      text-transform: uppercase;

    }


    .kta-number {

      display: inline-flex;

      align-items: center;

      justify-content: center;

      margin-top: 9px;

      padding: 6px 12px;

      min-height: 25px;

      border-radius: 99px;

      background: white;

      border:
        1px solid #f0c6cb;

      color: #bd081c;

      font-size: 9px;

      font-weight: 900;

      letter-spacing: .5px;

    }


    /* =====================================================
       FOOTER
    ===================================================== */


    .kta-bottom {

      position: absolute;

      z-index: 5;

      left: 7%;
      right: 7%;

      bottom: 6%;

      display: flex;

      align-items: center;

      gap: 10px;

      padding-top: 9px;

      border-top:
        1px solid
        rgba(189,8,28,.14);

    }


    .kta-qr {

      display: block;

      width: 23%;

      aspect-ratio: 1;

      object-fit: contain;

      background: white;

      padding: 3px;

      border-radius: 7px;

      border:
        1px solid #ead1d4;

    }


    .kta-footer-info {

      flex: 1;

      text-align: left;

    }


    .kta-position {

      color: #bd081c;

      font-size: 10px;

      font-weight: 900;

    }


    .kta-school {

      margin-top: 3px;

      font-size: 8px;

      line-height: 1.35;

      font-weight: 800;

      color: #44252a;

    }


    .kta-location {

      margin-top: 2px;

      font-size: 7px;

      color: #8a6d71;

    }


    .actions {

      display: flex;

      gap: 8px;

      width:
        min(100%, 360px);

    }


    .action-btn {

      flex: 1;

      padding: 11px;

      border: none;

      border-radius: 11px;

      cursor: pointer;

      font-size: 12px;

      font-weight: 800;

    }


    .btn-print {

      background: #bd081c;

      color: white;

    }


    .btn-search {

      background: white;

      color: #bd081c;

      border:
        1px solid #e6c6ca;

    }


    @media (max-width: 520px) {

      .kta-card {

        width:
          min(100%, 330px);

        border-radius: 18px;

      }

    }


    @media (max-width: 360px) {

      .kta-card {

        width: 285px;

      }

    }


    @media print {

      body {

        background: white;

      }


      .page {

        padding: 0;

        min-height: auto;

      }


      .actions {

        display: none;

      }


      .kta-stage {

        padding: 0;

      }


      .kta-card {

        width: 5.513cm;

        height: 8.72cm;

        aspect-ratio: auto;

        border-radius: .35cm;

        box-shadow: none;

        border: none;

      }

    }

  </style>

</head>


<body>


<div class="page">

  <div
    id="loading"
    class="loading"
  >

    <div class="spinner"></div>

    <div>
      Memuat data KTA...
    </div>

  </div>


  <div
    id="error"
    class="error"
    style="display:none"
  >

    <div class="error-icon">
      ⚠️
    </div>

    <h2>
      KTA Tidak Ditemukan
    </h2>

    <p id="errorText">
      Data anggota tidak ditemukan.
    </p>

  </div>


  <div
    id="ktaContainer"
    style="display:none"
  >


    <div class="kta-stage">

      <div
        id="ktaCard"
        class="kta-card"
      >

        <div class="kta-top"></div>


        <div class="kta-org">

          <strong>
            PALANG MERAH INDONESIA
          </strong>

          PMR MADYA<br>
          SMP NEGERI 1 MOGA


          <div class="kta-cross">
            ✚
          </div>

        </div>


        <div class="kta-photo-wrap">

          <img
            id="ktaPhoto"
            class="kta-photo"
            src=""
            alt="Foto Anggota PMR"
          >

        </div>


        <div class="kta-body">

          <div class="kta-label">
            Nama Anggota
          </div>


          <div
            id="ktaName"
            class="kta-name"
          >
            -
          </div>


          <div
            id="ktaNumber"
            class="kta-number"
          >
            -
          </div>

        </div>


        <div class="kta-bottom">

          <img
            id="ktaQR"
            class="kta-qr"
            src=""
            alt="QR Code KTA"
          >


          <div class="kta-footer-info">

            <div class="kta-position">
              PMR MADYA
            </div>

            <div class="kta-school">
              SMP NEGERI 1 MOGA
            </div>

            <div class="kta-location">
              Kab. Pemalang
            </div>

          </div>

        </div>

      </div>

    </div>


    <div class="actions">

      <button
        class="action-btn btn-print"
        onclick="window.print()"
      >
        🖨️ Cetak
      </button>


      <button
        class="action-btn btn-search"
        onclick="goSearch()"
      >
        🔎 Cari KTA
      </button>

    </div>


  </div>

</div>


<script>


  /*
   * API
   */

  const API_URL =
    'https://script.google.com/macros/s/AKfycbwlh56TBt1I1DK8M2rkdvQKFZXwWgTyTqOD9opCf8PjKTyHTsEWMKzhFwcSiK9xJ2OFWw/exec';


  /*
   * URL halaman KTA
   */

  const KTA_URL =
    'https://apxid.github.io/pmr/kta/';


  /*
   * Ambil parameter URL
   */

  const params =
    new URLSearchParams(
      window.location.search
    );


  const nisn =
    (
      params.get('nisn') ||
      ''
    ).trim();


  const nomor =
    (
      params.get('nomor') ||
      ''
    ).trim();


  /*
   * Jalankan
   */

  loadKTA();


  async function loadKTA() {

    try {

      if (
        !nisn &&
        !nomor
      ) {

        throw new Error(
          'NISN atau nomor anggota belum diberikan.'
        );

      }


      let url;


      /*
       * Prioritas NISN
       */

      if (nisn) {

        url =
          API_URL +
          '?action=searchNISN&nisn=' +
          encodeURIComponent(
            nisn
          );

      } else {

        url =
          API_URL +
          '?action=member&nomor=' +
          encodeURIComponent(
            nomor
          );

      }


      const response =
        await fetch(
          url,
          {
            method: 'GET',
            cache: 'no-store'
          }
        );


      if (
        !response.ok
      ) {

        throw new Error(
          'Server API tidak dapat dihubungi.'
        );

      }


      const result =
        await response.json();


      if (
        !result.success ||
        !result.member
      ) {

        throw new Error(
          result.message ||
          'Data anggota tidak ditemukan.'
        );

      }


      displayKTA(
        result.member
      );


    } catch (error) {

      console.error(
        error
      );


      showError(
        error.message
      );

    }

  }


  /*
   * Tampilkan KTA
   */

  function displayKTA(
    member
  ) {

    const nama =
      member.nama ||
      '-';


    const nomorAnggota =
      member.nomorAnggota ||
      '-';


    const foto =
      member.foto ||
      '';


    document
      .getElementById(
        'ktaName'
      )
      .textContent =
      nama;


    document
      .getElementById(
        'ktaNumber'
      )
      .textContent =
      nomorAnggota;


    const photoElement =
      document
        .getElementById(
          'ktaPhoto'
        );


    if (foto) {

      photoElement.src =
        foto;

    }


    /*
     * QR menuju halaman KTA
     */

    const qrTarget =
      KTA_URL +
      '?nisn=' +
      encodeURIComponent(
        member.nisn
      );


    const qrUrl =
      'https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=' +
      encodeURIComponent(
        qrTarget
      );


    document
      .getElementById(
        'ktaQR'
      )
      .src =
      qrUrl;


    /*
     * Title browser
     */

    document.title =
      'KTA PMR - ' +
      nama;


    /*
     * Tampilkan
     */

    document
      .getElementById(
        'loading'
      )
      .style.display =
      'none';


    document
      .getElementById(
        'ktaContainer'
      )
      .style.display =
      'block';

  }


  /*
   * Error
   */

  function showError(
    text
  ) {

    document
      .getElementById(
        'loading'
      )
      .style.display =
      'none';


    document
      .getElementById(
        'error'
      )
      .style.display =
      'block';


    document
      .getElementById(
        'errorText'
      )
      .textContent =
      text ||
      'Data anggota tidak ditemukan.';

  }


  /*
   * Tombol pencarian
   */

  function goSearch() {

    window.location.href =
      '../search.html';

  }


</script>

</body>

</html>
