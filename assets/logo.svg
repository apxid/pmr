<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Gradasi Merah Khas PMR -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E53935" />
      <stop offset="100%" stop-color="#8E0000" />
    </linearGradient>

    <!-- Shadow Effect Halus -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <g filter="url(#dropShadow)">
    <!-- 6 KELOPAK BUNGA MENYATU (Bertumpuk di Belakang Lingkaran) -->
    <!-- Kelopak 1 (0 Deg) -->
    <path d="M 300 300 C 180 80, 180 -10, 300 -10 C 420 -10, 420 80, 300 300 Z" 
          fill="url(#redGrad)" stroke="#FFFFFF" stroke-width="6" transform="rotate(0 300 300)" />
    <!-- Kelopak 2 (60 Deg) -->
    <path d="M 300 300 C 180 80, 180 -10, 300 -10 C 420 -10, 420 80, 300 300 Z" 
          fill="url(#redGrad)" stroke="#FFFFFF" stroke-width="6" transform="rotate(60 300 300)" />
    <!-- Kelopak 3 (120 Deg) -->
    <path d="M 300 300 C 180 80, 180 -10, 300 -10 C 420 -10, 420 80, 300 300 Z" 
          fill="url(#redGrad)" stroke="#FFFFFF" stroke-width="6" transform="rotate(120 300 300)" />
    <!-- Kelopak 4 (180 Deg) -->
    <path d="M 300 300 C 180 80, 180 -10, 300 -10 C 420 -10, 420 80, 300 300 Z" 
          fill="url(#redGrad)" stroke="#FFFFFF" stroke-width="6" transform="rotate(180 300 300)" />
    <!-- Kelopak 5 (240 Deg) -->
    <path d="M 300 300 C 180 80, 180 -10, 300 -10 C 420 -10, 420 80, 300 300 Z" 
          fill="url(#redGrad)" stroke="#FFFFFF" stroke-width="6" transform="rotate(240 300 300)" />
    <!-- Kelopak 6 (300 Deg) -->
    <path d="M 300 300 C 180 80, 180 -10, 300 -10 C 420 -10, 420 80, 300 300 Z" 
          fill="url(#redGrad)" stroke="#FFFFFF" stroke-width="6" transform="rotate(300 300 300)" />

    <!-- LINGKARAN TENGAH PENUH (BESAR 80% AREA) -->
    <circle cx="300" cy="300" r="200" fill="#FFFFFF" stroke="#1E293B" stroke-width="8" />

    <!-- SIMBOL PALANG MERAH DI TENGAH (PRESISI & TEGAS) -->
    <g fill="url(#redGrad)">
      <rect x="260" y="180" width="80" height="240" rx="12" />
      <rect x="180" y="260" width="240" height="80" rx="12" />
    </g>
  </g>
</svg>
