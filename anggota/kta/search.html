<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cari Anggota / KTA PMR - SMPN 1 Moga</title>
  <style>
    * { 
      box-sizing: border-box; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      margin: 0; 
      padding: 0; 
    }
    body { 
      background-color: #f4f6f9; 
      color: #333; 
    }
    
    header { 
      background: linear-gradient(135deg, #b71c1c 0%, #8e0000 100%); 
      color: white; 
      text-align: center; 
      padding: 1.5rem 1rem; 
    }
    header h2 { font-size: 1.4rem; }
    header p { font-size: 0.85rem; opacity: 0.9; }

    nav { 
      background: #6a0000; 
      display: flex; 
      justify-content: center; 
      flex-wrap: wrap; 
      padding: 5px; 
      position: sticky; 
      top: 0; 
      z-index: 100; 
    }
    nav a { 
      color: white; 
      text-decoration: none; 
      font-weight: 600; 
      padding: 10px 16px; 
      border-radius: 4px; 
      font-size: 0.9rem; 
    }
    nav a.active { background: rgba(255, 255, 255, 0.2); }

    .container { 
      max-width: 600px; 
      margin: 1.5rem auto; 
      padding: 0 1rem; 
    }
    
    .search-card { 
      background: white; 
      padding: 1.2rem; 
      border-radius: 12px; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
      margin-bottom: 1.5rem; 
    }
    .search-box { display: flex; gap: 8px; }
    input[type="text"] { 
      flex: 1; 
      padding: 12px; 
      border: 1px solid #ccc; 
      border-radius: 6px; 
      font-size: 0.95rem; 
      outline: none; 
      transition: border-color 0.2s;
    }
    input[type="text"]:focus { border-color: #b71c1c; }
    button { 
      padding: 12px 18px; 
      background: #b71c1c; 
      color: white; 
      border: none; 
      border-radius: 6px; 
      font-weight: bold; 
      cursor: pointer; 
      font-size: 0.95rem; 
      transition: background 0.2s;
    }
    button:hover { background: #8e0000; }
    button:active { background: #6a0000; }

    #loading { 
      text-align: center; 
      font-weight: bold; 
      color: #b71c1c; 
      margin: 1rem 0; 
      display: none; 
    }

    .result-item { 
      background: white; 
      padding: 1rem; 
      border-radius: 10px; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.06); 
      margin-bottom: 1rem; 
      display: flex; 
      align-items: center; 
      gap: 12px; 
      flex-wrap: wrap;
    }
    .result-photo { 
      width: 65px; 
      height: 85px; 
      object-fit: cover; 
      border-radius: 6px; 
      border: 1px solid #ddd; 
      background: #eee; 
      flex-shrink: 0; 
    }
    .result-info { flex: 1; min-width: 200px; }
    .result-info h4 { 
      font-size: 1rem; 
      color: #111; 
      margin-bottom: 4px; 
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis; 
    }
    .result-info p { font-size: 0.8rem; color: #666; margin-bottom: 2px; }
    .result-info .jabatan { color: #b71c1c; font-weight: bold; }
    
    .status-badge {
      display: inline-block;
      padding: 3px 8px;
      font-size: 0.75rem;
      font-weight: bold;
      border-radius: 4px;
      margin-top: 4px;
    }
    .badge-approved { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
    .badge-pending { background: #fff8e1; color: #b78103; border: 1px solid #ffe082; }
    .badge-rejected { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }

    .btn-cta { 
      display: inline-block; 
      background: #2e7d32; 
      color: white; 
      text-decoration: none; 
      padding: 8px 12px; 
      border-radius: 6px; 
      font-size: 0.8rem; 
      font-weight: bold; 
      flex-shrink: 0; 
      text-align: center; 
      transition: background 0.2s;
    }
    .btn-cta:hover { background: #1b5e20; }

    .btn-cta-disabled {
      background: #ccc;
      color: #666;
      cursor: not-allowed;
      pointer-events: none;
    }

    .alert { 
      padding: 12px; 
      border-radius: 8px; 
      text-align: center; 
      font-size: 0.9rem; 
      line-height: 1.4; 
    }
    .alert-pending { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
    .alert-danger { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

    @media (max-width: 480px) {
      .result-item { flex-direction: column; text-align: center; }
      .result-info { width: 100%; margin-bottom: 8px; }
      .btn-cta { width: 100%; }
    }
  </style>
</head>
<body>

  <header>
    <h2>Pencarian Anggota & KTA</h2>
    <p>SMP Negeri 1 Moga</p>
  </header>

  <nav>
    <a href="index.html">Beranda</a>
    <a href="daftar.html">Pendaftaran</a>
    <a href="search.html" class="active">Cari KTA</a>
  </nav>

  <div class="container">
    <div class="search-card">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Masukkan NISN atau Nama..." onkeypress="handleKeyPress(event)">
        <button onclick="doSearch()">Cari</button>
      </div>
    </div>

    <div id="loading">Sedang mencari data...</div>
    <div id="results"></div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwFqMBYcmqbXvu-MzrSbvmmBixwzWIF_t4kUVLkaxvoGx-F9vZgLjH2yy556W-sV_lD/exec";

    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      const query = urlParams.get('q');
      if (query) {
        document.getElementById('searchInput').value = query;
        doSearch();
      }
    };

    function handleKeyPress(e) {
      if (e.key === 'Enter') {
        doSearch();
      }
    }

    function doSearch() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      if (!query) return;

      const resultsDiv = document.getElementById('results');
      const loadingDiv = document.getElementById('loading');

      resultsDiv.innerHTML = '';
      loadingDiv.style.display = 'block';

      fetch(SCRIPT_URL)
        .then(res => res.json())
        .then(res => {
          loadingDiv.style.display = 'none';

          if (res.success && Array.isArray(res.data)) {
            // Filter berdasarkan NISN atau Nama
            const filteredData = res.data.filter(item => {
              const nama = (item.nama || '').toLowerCase();
              const nisn = (item.nisn || '').toLowerCase();
              return nama.includes(query) || nisn.includes(query);
            });

            if (filteredData.length > 0) {
              filteredData.forEach(item => {
                const card = document.createElement('div');
                card.className = 'result-item';

                const photoSrc = item.foto || 'https://via.placeholder.com/65x85?text=No+Foto';
                const ttl = [item.tempatLahir, item.tanggalLahir].filter(Boolean).join(', ');
                const statusValidasi = (item.validasi || 'Pending').trim();
                const isApproved = statusValidasi.toLowerCase() === 'disetujui' || statusValidasi.toLowerCase() === 'approved';
                const isRejected = statusValidasi.toLowerCase() === 'ditolak' || statusValidasi.toLowerCase() === 'rejected';

                // Susun query parameter untuk dikirim ke card.html
                const cardParams = new URLSearchParams({
                  nama: item.nama || '',
                  nisn: item.nisn || '',
                  kelas: item.kelas || '',
                  jk: item.gender || '',
                  jabatan: item.status || '',
                  ttl: ttl,
                  gol: item.golDarah || '',
                  foto: item.foto || ''
                });

                const cardUrl = `card.html?${cardParams.toString()}`;

                let badgeHtml = '';
                let actionBtnHtml = '';

                if (isApproved) {
                  badgeHtml = `<span class="status-badge badge-approved">✓ Status: Disetujui</span>`;
                  actionBtnHtml = `<a href="${cardUrl}" class="btn-cta">Cetak KTA</a>`;
                } else if (isRejected) {
                  badgeHtml = `<span class="status-badge badge-rejected">✕ Status: Ditolak</span>`;
                  actionBtnHtml = `<a href="#" class="btn-cta btn-cta-disabled">KTA Tidak Tersedia</a>`;
                } else {
                  badgeHtml = `<span class="status-badge badge-pending">⏳ Status: Menunggu Validasi</span>`;
                  actionBtnHtml = `<a href="#" class="btn-cta btn-cta-disabled">Cetak KTA (Pending)</a>`;
                }

                card.innerHTML = `
                  <img src="${escapeHtml(photoSrc)}" class="result-photo" alt="Foto ${escapeHtml(item.nama || '')}" onerror="this.src='https://via.placeholder.com/65x85?text=No+Foto'">
                  <div class="result-info">
                    <h4>${escapeHtml(item.nama || '-')}</h4>
                    <p>NISN: <strong>${escapeHtml(item.nisn || '-')}</strong> | Kelas: <strong>${escapeHtml(item.kelas || '-')}</strong></p>
                    <p class="jabatan">Jabatan PMR: ${escapeHtml(item.status || '-')}</p>
                    ${badgeHtml}
                  </div>
                  ${actionBtnHtml}
                `;
                resultsDiv.appendChild(card);
              });
            } else {
              resultsDiv.innerHTML = `
                <div class="alert alert-danger">
                  Data dengan NISN atau nama "<strong>${escapeHtml(query)}</strong>" tidak ditemukan.
                </div>
              `;
            }
          } else {
            resultsDiv.innerHTML = `
              <div class="alert alert-danger">
                ${escapeHtml(res.message || "Gagal mengambil data dari server.")}
              </div>
            `;
          }
        })
        .catch(err => {
          console.error("Fetch Error:", err);
          loadingDiv.style.display = 'none';
          resultsDiv.innerHTML = '<div class="alert alert-danger">Terjadi kesalahan koneksi. Silakan periksa koneksi internet Anda.</div>';
        });
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text
        .toString()
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
