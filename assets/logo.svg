<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradasi Latar Belakang Kotak -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f6f8"/>
    </linearGradient>

    <!-- Gradasi Merah Utama (Clean & Bold) -->
    <linearGradient id="pmiRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>

    <!-- Gradasi Bingkai Luar -->
    <linearGradient id="borderRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d32f2f"/>
      <stop offset="100%" stop-color="#8e0000"/>
    </linearGradient>

    <!-- Drop Shadow yang Halus dan Elegan -->
    <filter id="cleanShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- 1. BINGKAI KOTAK UTAMA (OUTER ROUNDED SQUARE) -->
  <g filter="url(#cleanShadow)">
    <rect x="25" y="25" width="450" height="450" rx="52" 
          fill="url(#cardBg)" stroke="url(#borderRed)" stroke-width="10"/>
    
    <!-- Bingkai Dalam (Solid Double Line, Clean tanpa garis putus-putus) -->
    <rect x="42" y="42" width="416" height="416" rx="36" 
          fill="none" stroke="#d32f2f" stroke-width="2.5" stroke-opacity="0.3"/>
  </g>

  <!-- 2. SIMBOL UTAMA: BUNGA MELATI 5 KELOPAK -->
  <g id="PMR_Flower" transform="translate(0, -18)">
    <!-- Kelopak Bunga Melati (Garis Solid Merah) -->
    <path d="M 250,85 
             C 288,85 320,108 331,140 
             C 364,138 399,161 406,196 
             C 414,231 392,265 368,287 
             C 384,319 370,359 340,378 
             C 311,397 272,389 250,367 
             C 228,389 189,397 160,378 
             C 130,359 116,319 132,287 
             C 108,265 86,231 94,196 
             C 101,161 136,138 169,140 
             C 180,108 212,85 250,85 Z" 
          fill="#ffffff" stroke="url(#pmiRed)" stroke-width="13" stroke-linejoin="round"/>

    <!-- Palang Merah Presisi -->
    <path d="M 220,160 H 280 V 220 H 340 V 280 H 280 V 340 H 220 V 280 H 160 V 220 H 220 Z" 
          fill="url(#pmiRed)" rx="3"/>
  </g>

  <!-- 3. BANNER TEKS BAWAH (CLEAN SOLID BADGE) -->
  <rect x="110" y="408" width="280" height="42" rx="21" fill="url(#pmiRed)" />
  
  <text x="250" y="435" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="18" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">
    PMR SMPN 1 MOGA
  </text>
</svg>
