<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Pencarian KTA PMR - SMP Negeri 1 Moga
  </title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #fff5f6,
          #fce5e7
        );

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 20px;

      color: #3b1117;

    }


    .search-container {

      width: 100%;

      max-width: 430px;

      background: white;

      border-radius: 24px;

      padding: 30px 25px;

      box-shadow:
        0 20px 50px
        rgba(80, 0, 15, .16);

      text-align: center;

    }


    .logo {

      width: 70px;

      height: 70px;

      margin: 0 auto 15px;

      border-radius: 18px;

      background:
        linear-gradient(
          135deg,
          #8f0016,
          #e1273d
        );

      display: flex;

      align-items: center;

      justify-content: center;

      color: white;

      font-size: 34px;

      font-weight: 900;

      box-shadow:
        0 8px 20px
        rgba(189, 8, 28, .25);

    }


    h1 {

      margin: 0;

      font-size: 22px;

      font-weight: 900;

    }


    .subtitle {

      margin-top: 8px;

      color: #8a6d71;

      font-size: 13px;

      line-height: 1.5;

    }


    .form {

      margin-top: 25px;

      text-align: left;

    }


    label {

      display: block;

      margin-bottom: 8px;

      font-size: 12px;

      font-weight: 800;

      color: #5c3036;

    }


    input {

      width: 100%;

      height: 48px;

      padding: 0 15px;

      border-radius: 12px;

      border:
        1px solid #e7c9cd;

      outline: none;

      font-size: 14px;

      color: #3b1117;

      transition: .2s;

    }


    input:focus {

      border-color: #bd081c;

      box-shadow:
        0 0 0 3px
        rgba(189, 8, 28, .10);

    }


    button {

      width: 100%;

      height: 48px;

      margin-top: 14px;

      border: none;

      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          #8f0016,
          #bd081c,
          #e1273d
        );

      color: white;

      font-size: 14px;

      font-weight: 900;

      cursor: pointer;

      box-shadow:
        0 8px 18px
        rgba(189, 8, 28, .20);

    }


    button:disabled {

      opacity: .6;

      cursor: wait;

    }


    .hint {

      margin-top: 14px;

      font-size: 11px;

      line-height: 1.5;

      color: #9c7b80;

    }


    .message {

      display: none;

      margin-top: 18px;

      padding: 12px;

      border-radius: 10px;

      font-size: 12px;

      line-height: 1.5;

    }


    .message.error {

      display: block;

      background: #fff0f1;

      color: #a40017;

      border:
        1px solid #f3c3c8;

    }


    .message.loading {

      display: block;

      background: #fff8f8;

      color: #8f0016;

      border:
        1px solid #f0d7da;

    }


    .footer {

      margin-top: 25px;

      padding-top: 15px;

      border-top:
        1px solid #f1dfe1;

      font-size: 10px;

      color: #a18488;

    }

  </style>

</head>


<body>


  <div class="search-container">


    <div class="logo">
      ✚
    </div>


    <h1>
      Pencarian KTA PMR
    </h1>


    <div class="subtitle">

      PMR Madya<br>

      SMP Negeri 1 Moga

    </div>


    <form
      id="searchForm"
      class="form"
    >

      <label for="keyword">

        NISN / Nama / Nomor Anggota

      </label>


      <input
        id="keyword"
        type="text"
        placeholder="Masukkan NISN, nama, atau nomor anggota"
        autocomplete="off"
        required
      >


      <button
        id="searchButton"
        type="submit"
      >

        🔎 CARI KTA

      </button>


    </form>


    <div
      id="message"
      class="message"
    ></div>


    <div class="hint">

      Contoh:<br>

      <b>1234567890</b><br>

      atau <b>3327.PMR.01.001</b><br>

      atau nama anggota

    </div>


    <div class="footer">

      Sistem KTA PMR Madya<br>

      SMP Negeri 1 Moga

    </div>


  </div>



  <script>

    /*
     * =====================================================
     * KONFIGURASI API
     * =====================================================
     */

    const API_URL =
      'https://script.google.com/macros/s/AKfycbwlh56TBt1I1DK8M2rkdvQKFZXwWgTyTqOD9opCf8PjKTyHTsEWMKzhFwcSiK9xJ2OFWw/exec';


    /*
     * =====================================================
     * ELEMENT
     * =====================================================
     */

    const form =
      document.getElementById(
        'searchForm'
      );


    const input =
      document.getElementById(
        'keyword'
      );


    const button =
      document.getElementById(
        'searchButton'
      );


    const message =
      document.getElementById(
        'message'
      );


    /*
     * =====================================================
     * PESAN
     * =====================================================
     */

    function showMessage(
      text,
      type
    ) {

      message.textContent =
        text;

      message.className =
        'message ' + type;

    }


    function clearMessage() {

      message.textContent =
        '';

      message.className =
        'message';

    }


    /*
     * =====================================================
     * SEARCH
     * =====================================================
     */

    form.addEventListener(
      'submit',
      async function(event) {

        event.preventDefault();


        const keyword =
          input.value.trim();


        if (!keyword) {

          showMessage(
            'Silakan masukkan NISN, nama, atau nomor anggota.',
            'error'
          );

          return;

        }


        button.disabled =
          true;

        button.textContent =
          'MENCARI...';


        showMessage(
          'Sedang mencari data anggota...',
          'loading'
        );


        try {

          const url =
            API_URL +
            '?action=search&keyword=' +
            encodeURIComponent(
              keyword
            );


          const response =
            await fetch(
              url,
              {
                method: 'GET',
                cache: 'no-store'
              }
            );


          if (!response.ok) {

            throw new Error(
              'Server tidak dapat dihubungi.'
            );

          }


          const result =
            await response.json();


          if (
            !result.success ||
            !result.member
          ) {

            throw new Error(
              result.message ||
              'Data anggota tidak ditemukan.'
            );

          }


          /*
           * ================================================
           * DATA DITEMUKAN
           * ================================================
           */

          const nisn =
            result.member.nisn;


          if (!nisn) {

            throw new Error(
              'NISN anggota tidak tersedia.'
            );

          }


          /*
           * REDIRECT KE TEMPLATE KTA
           */

          window.location.href =
            'template.html?nisn=' +
            encodeURIComponent(
              nisn
            );


        } catch (error) {

          console.error(
            error
          );


          showMessage(
            error.message ||
            'Pencarian gagal.',
            'error'
          );


          button.disabled =
            false;

          button.textContent =
            '🔎 CARI KTA';

        }

      }
    );


    /*
     * =====================================================
     * AUTO FOCUS
     * =====================================================
     */

    window.addEventListener(
      'load',
      function() {

        input.focus();

      }
    );

  </script>


</body>

</html>
