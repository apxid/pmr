<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>FIRST AIDER - Psychological First Aid</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{

width:100%;
height:100%;
overflow:hidden;
font-family:'Poppins',sans-serif;
background:#001b4d;

}

/*=============================
BACKGROUND
=============================*/

body{

background:url("https://apxid.github.io/pmr/pfa/backdrop.png");

background-size:cover;
background-position:center;
background-repeat:no-repeat;

animation:bgZoom 40s ease-in-out infinite alternate;

}

@keyframes bgZoom{

0%{

transform:scale(1);

}

100%{

transform:scale(1.05);

}

}

/*=============================
OVERLAY
=============================*/

.overlay{

position:absolute;
left:0;
top:0;
right:0;
bottom:0;

background:

linear-gradient(
180deg,
rgba(0,0,0,.15),
rgba(0,0,0,.02),
rgba(0,0,0,.25)
);

pointer-events:none;

}

/*=============================
LIGHT EFFECT
=============================*/

.light{

position:absolute;

width:800px;
height:800px;

border-radius:50%;

filter:blur(150px);

opacity:.18;

animation:lightMove 20s infinite alternate;

}

.light.left{

left:-250px;
top:-250px;

background:#00bfff;

}

.light.right{

right:-250px;
bottom:-250px;

background:#00ffe0;

animation-delay:8s;

}

@keyframes lightMove{

0%{

transform:translate(0,0);

}

100%{

transform:translate(120px,-80px);

}

}

/*=============================
SHIMMER
=============================*/

.shimmer{

position:absolute;

left:-30%;
top:0;

width:30%;
height:100%;

background:

linear-gradient(

90deg,

transparent,

rgba(255,255,255,.20),

transparent

);

transform:skewX(-20deg);

animation:shimmer 10s infinite;

}

@keyframes shimmer{

0%{

left:-35%;

}

100%{

left:135%;

}

}

/*=============================
SLOGAN
=============================*/

.slogan{

position:absolute;

bottom:100px;

width:100%;

text-align:center;

font-size:42px;

font-weight:800;

color:white;

letter-spacing:2px;

text-shadow:

0 0 10px #1d8cff,

0 0 30px #1d8cff;

animation:sloganPulse 3s infinite;

transition:opacity 0.5s ease;

}

@keyframes sloganPulse{

50%{

transform:scale(1.02);

}

}

/*=============================
HEART
=============================*/

.heart{

position:absolute;

left:50%;

top:70%;

transform:translateX(-50%);

font-size:65px;

filter:drop-shadow(0 0 15px red);

animation:heartbeat 1s infinite;

}

@keyframes heartbeat{

0%{

transform:translateX(-50%) scale(1);

}

30%{

transform:translateX(-50%) scale(1.2);

}

50%{

transform:translateX(-50%) scale(1);

}

}

/*=============================
TICKER
=============================*/

.ticker{

position:absolute;

bottom:0;

left:0;

width:100%;

height:60px;

background:

rgba(0,36,92,.93);

border-top:

3px solid #ffd54f;

overflow:hidden;

display:flex;

align-items:center;

z-index:50;

}

.ticker span{

white-space:nowrap;

padding-left:100%;

font-size:28px;

font-weight:700;

color:white;

animation:marquee 40s linear infinite;

}

@keyframes marquee{

0%{

transform:translateX(0);

}

100%{

transform:translateX(-100%);

}

}

/*=============================
WAVE
=============================*/

.wave{

position:absolute;

left:0;

bottom:60px;

width:200%;

height:180px;

opacity:.18;

background:url("https://svgshare.com/i/15eG.svg");

background-size:50% 100%;

animation:waveMove 35s linear infinite;

}

@keyframes waveMove{

from{

transform:translateX(0);

}

to{

transform:translateX(-50%);

}

}

/*=============================
PARTICLE
=============================*/

.particle{

position:absolute;

width:6px;

height:6px;

border-radius:50%;

background:white;

opacity:.4;

filter:blur(1px);

}

/*=============================
LOADING
=============================*/

#loading{

position:absolute;

left:0;
top:0;
right:0;
bottom:0;

background:#001d55;

display:flex;

justify-content:center;

align-items:center;

flex-direction:column;

z-index:999;

color:white;

font-size:28px;

font-weight:700;

}

.loader{

width:70px;

height:70px;

border-radius:50%;

border:6px solid rgba(255,255,255,.2);

border-top:6px solid white;

animation:spin 1s linear infinite;

margin-bottom:25px;

}

@keyframes spin{

to{

transform:rotate(360deg);

}

}

</style>

</head>

<body>

<div id="loading">

<div class="loader"></div>

Preparing Event...

</div>

<div class="overlay"></div>

<div class="light left"></div>

<div class="light right"></div>

<div class="shimmer"></div>

<div class="wave"></div>

<div class="heart">

❤️

</div>

<div class="slogan" id="slogan">

PEDULI • TANGGAP • KUAT BERSAMA

</div>

<div class="ticker">

<span id="tickerText">

📢 Selamat Datang Peserta Kegiatan FIRST AIDER (PFA) • PMR SMP Negeri 1 Moga • Bersama Puskesmas Banyumudal • Peduli • Tanggap • Kuat Bersama • Menjadi Pendengar yang Baik • Terima Kasih atas Kehadiran Anda •

</span>

</div>

<script>

/*=========================================
LOADING SCREEN
=========================================*/

window.addEventListener("load",()=>{

setTimeout(()=>{

document.getElementById("loading").style.opacity="0";

document.getElementById("loading").style.transition="1s";

setTimeout(()=>{

document.getElementById("loading").style.display="none";

},1000);

},2000);

});


/*=========================================
SLOGAN ROTATE
=========================================*/

const slogans=[

"PEDULI • TANGGAP • KUAT BERSAMA",

"MENJADI PENDENGAR YANG BAIK",

"PERTOLONGAN PERTAMA PADA LUKA PSIKOLOGIS",

"FIRST AIDER (PFA)",

"PMR SMP NEGERI 1 MOGA",

"BERSAMA PUSKESMAS BANYUMUDAL",

"BERSAMA KITA SALING MENGUATKAN"

];

let sloganIndex=0;

const slogan=document.getElementById("slogan");

setInterval(()=>{

slogan.style.opacity=0;

setTimeout(()=>{

sloganIndex++;

slogan.innerHTML=

slogans[sloganIndex%slogans.length];

slogan.style.opacity=1;

},500);

},5000);


/*=========================================
PARTICLES
=========================================*/

for(let i=0;i<80;i++){

let p=document.createElement("div");

p.className="particle";

let size=Math.random()*7+2;

p.style.width=size+"px";

p.style.height=size+"px";

p.style.left=Math.random()*100+"vw";

p.style.top=Math.random()*100+"vh";

p.style.opacity=Math.random()*.5+.2;

document.body.appendChild(p);

animateParticle(p);

}

function animateParticle(el){

let x=parseFloat(el.style.left);

let y=parseFloat(el.style.top);

let speed=Math.random()*0.15+0.03;

function frame(){

y-=speed;

x+=Math.sin(y/30)*0.02;

if(y<-5){

y=105;

x=Math.random()*100;

}

el.style.left=x+"vw";

el.style.top=y+"vh";

requestAnimationFrame(frame);

}

frame();

}


/*=========================================
AUTO HIDE CURSOR
=========================================*/

let cursorTimer;

function hideCursor(){

document.body.style.cursor="none";

}

function resetCursor(){

document.body.style.cursor="default";

clearTimeout(cursorTimer);

cursorTimer=setTimeout(hideCursor,5000);

}

document.addEventListener("mousemove",resetCursor);

resetCursor();


/*=========================================
FULLSCREEN
=========================================*/

function openFullscreen(){

if(!document.fullscreenElement){

document.documentElement.requestFullscreen();

}

}

document.body.addEventListener("click",openFullscreen);

document.addEventListener("keydown",e=>{

if(e.key==="f" || e.key==="F"){

openFullscreen();

}

});


/*=========================================
DISABLE RIGHT CLICK
=========================================*/

document.addEventListener("contextmenu",e=>{

e.preventDefault();

});


/*=========================================
TICKER
=========================================*/

const ticker=document.getElementById("tickerText");

ticker.innerHTML=

"Selamat Datang Peserta Kegiatan FIRST AIDER (PFA) • PMR SMP Negeri 1 Moga • Bersama Puskesmas Banyumudal • Peduli • Tanggap • Kuat Bersama • Menjadi Pendengar yang Baik • Terima kasih atas kehadiran seluruh peserta • Semoga kegiatan berjalan lancar •";

</script>

</body>
</html>
