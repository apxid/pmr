<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Quiz PMR Pertemuan Ke-3</title>


<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #ef4444, #991b1b);
    min-height: 100vh;
    padding: 20px;
}


/* =========================
   CONTAINER
========================= */

.container {
    max-width: 900px;
    margin: auto;
}


/* =========================
   HEADER
========================= */

.header {
    background: white;
    border-radius: 20px;
    padding: 30px;
    text-align: center;
    margin-bottom: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

.logo {
    font-size: 55px;
}

.header h1 {
    margin: 10px 0;
    color: #b91c1c;
}

.header p {
    color: #555;
    margin: 5px 0;
}


/* =========================
   PROGRESS
========================= */

.progress-box {
    background: white;
    padding: 15px;
    border-radius: 15px;
    margin-bottom: 20px;
}

.progress-text {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
    font-weight: bold;
}

.progress-bar {
    width: 100%;
    height: 12px;
    background: #e5e7eb;
    border-radius: 20px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: #dc2626;
    transition: 0.4s;
}


/* =========================
   QUIZ CARD
========================= */

.quiz-card {
    background: white;
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

.question-number {
    color: #777;
    font-size: 14px;
    font-weight: bold;
}

.question {
    font-size: 22px;
    font-weight: bold;
    line-height: 1.6;
    margin: 15px 0 25px;
}


/* =========================
   TRUE FALSE
========================= */

.answer-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.answer-btn {
    border: none;
    padding: 18px;
    border-radius: 12px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

.answer-btn:hover:not(:disabled) {
    transform: scale(1.03);
}

.answer-btn:disabled {
    cursor: not-allowed;
    opacity: 0.7;
}

.true-btn {
    background: #16a34a;
    color: white;
}

.false-btn {
    background: #dc2626;
    color: white;
}


/* =========================
   MULTIPLE CHOICE
========================= */

.multiple-choice {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.choice-btn {
    width: 100%;
    text-align: left;
    border: 2px solid #e5e7eb;
    background: white;
    padding: 16px;
    border-radius: 12px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.2s;
}

.choice-btn:hover:not(:disabled) {
    border-color: #dc2626;
    transform: translateX(5px);
}

.choice-btn:disabled {
    cursor: not-allowed;
}

.choice-letter {
    display: inline-flex;
    width: 32px;
    height: 32px;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: #e5e7eb;
    font-weight: bold;
    margin-right: 10px;
}


/* =========================
   FEEDBACK
========================= */

.feedback {
    display: none;
    margin-top: 25px;
    padding: 20px;
    border-radius: 12px;
    font-size: 18px;
    font-weight: bold;
    text-align: center;
}

.feedback.correct {
    display: block;
    background: #dcfce7;
    color: #166534;
    border: 2px solid #16a34a;
}

.feedback.wrong {
    display: block;
    background: #fee2e2;
    color: #991b1b;
    border: 2px solid #dc2626;
}

.correct-choice {
    background: #dcfce7 !important;
    border-color: #16a34a !important;
}

.wrong-choice {
    background: #fee2e2 !important;
    border-color: #dc2626 !important;
}


/* =========================
   NAVIGATION
========================= */

.navigation {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    margin-top: 30px;
}

.nav-btn {
    border: none;
    padding: 14px 25px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.prev-btn {
    background: #e5e7eb;
}

.next-btn {
    background: #b91c1c;
    color: white;
}

.submit-btn {
    background: #15803d;
    color: white;
}


/* =========================
   RESULT
========================= */

.result {
    display: none;
}

.score-box {
    text-align: center;
    padding: 30px;
    border-radius: 20px;
    background: #fef2f2;
    margin-bottom: 25px;
}

.score-number {
    font-size: 60px;
    font-weight: bold;
    color: #b91c1c;
}


/* =========================
   REVIEW
========================= */

.review-item {
    border-left: 6px solid #ddd;
    background: #f9fafb;
    padding: 15px;
    margin-bottom: 15px;
    border-radius: 10px;
}

.correct-review {
    border-left-color: #16a34a;
}

.wrong-review {
    border-left-color: #dc2626;
}

.review-question {
    font-weight: bold;
    margin-bottom: 10px;
}

.review-answer {
    font-size: 14px;
    line-height: 1.6;
}


/* =========================
   RETRY
========================= */

.retry-btn {
    width: 100%;
    padding: 18px;
    border: none;
    border-radius: 12px;
    background: #b91c1c;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px) {

    body {
        padding: 12px;
    }

    .quiz-card {
        padding: 20px;
    }

    .question {
        font-size: 19px;
    }

    .answer-buttons {
        grid-template-columns: 1fr;
    }

    .navigation {
        flex-direction: column;
    }

    .nav-btn {
        width: 100%;
    }

}

</style>

</head>


<body>


<div class="container">


<!-- =========================
     HEADER
========================= -->

<div class="header">

    <div class="logo">
        ⛑️
    </div>

    <h1>
        QUIZ PMR
    </h1>

    <p>
        Pertemuan Ke-3
    </p>

    <p>
        Stand By Kesehatan Saat Upacara Bendera
    </p>

</div>



<!-- =========================
     PROGRESS
========================= -->

<div class="progress-box">

    <div class="progress-text">

        <span id="progressText">
            Soal 1 dari 15
        </span>

        <span id="percentage">
            0%
        </span>

    </div>

    <div class="progress-bar">

        <div
            class="progress-fill"
            id="progressFill"
        >
        </div>

    </div>

</div>



<!-- =========================
     QUIZ
========================= -->

<div
    class="quiz-card"
    id="quizCard"
>

    <div
        class="question-number"
        id="questionNumber"
    >
    </div>


    <div
        class="question"
        id="question"
    >
    </div>


    <div
        id="answerArea"
    >
    </div>


    <div
        class="feedback"
        id="feedback"
    >
    </div>


    <div class="navigation">

        <button
            class="nav-btn prev-btn"
            id="prevButton"
            onclick="previousQuestion()"
        >
            ← Sebelumnya
        </button>


        <button
            class="nav-btn next-btn"
            id="nextButton"
            onclick="nextQuestion()"
        >
            Selanjutnya →
        </button>

    </div>

</div>



<!-- =========================
     RESULT
========================= -->

<div
    class="quiz-card result"
    id="resultCard"
>

    <div class="score-box">

        <div class="logo">
            🏆
        </div>

        <h2>
            Quiz Selesai!
        </h2>

        <p>
            Skor Kamu
        </p>

        <div
            class="score-number"
            id="score"
        >
            0
        </div>

        <p id="scoreDescription">
        </p>

    </div>


    <h2>
        📝 Hasil Jawaban
    </h2>


    <div id="review">
    </div>


    <button
        class="retry-btn"
        onclick="restartQuiz()"
    >
        🔄 Ulangi Quiz
    </button>

</div>


</div>



<script>


/* =========================
   DATA SOAL
========================= */

const questions = [

/* ==========================================
   SOAL 1 - 10
   BENAR / SALAH
========================================== */

{
    type: "truefalse",

    question:
    "Anggota PMR harus tetap tenang ketika ada siswa yang mengalami keluhan kesehatan saat upacara.",

    answer: true
},

{
    type: "truefalse",

    question:
    "Ketika ada siswa hampir pingsan, semua anggota PMR harus berlari menuju korban.",

    answer: false
},

{
    type: "truefalse",

    question:
    "PMR perlu mengetahui area tugas dan jalur menuju UKS sebelum bertugas.",

    answer: true
},

{
    type: "truefalse",

    question:
    "Siswa yang belum sadar boleh langsung dipaksa minum air putih.",

    answer: false
},

{
    type: "truefalse",

    question:
    "PMR tidak boleh memberikan obat sembarangan tanpa arahan guru atau petugas kesehatan.",

    answer: true
},

{
    type: "truefalse",

    question:
    "Salah satu tanda siswa mengalami gangguan kesehatan saat upacara adalah wajah pucat dan badan lemas.",

    answer: true
},

{
    type: "truefalse",

    question:
    "Korban yang sakit harus dipaksa berdiri agar bisa segera kembali ke barisan.",

    answer: false
},

{
    type: "truefalse",

    question:
    "Jika kondisi siswa memburuk, anggota PMR harus segera melaporkan kepada guru atau petugas UKS.",

    answer: true
},

{
    type: "truefalse",

    question:
    "Anggota PMR boleh mengambil foto atau video siswa yang sedang sakit untuk dibagikan kepada teman.",

    answer: false
},

{
    type: "truefalse",

    question:
    "Kerja sama dan koordinasi antaranggota PMR sangat penting saat menangani siswa yang mengalami masalah kesehatan.",

    answer: true
},


/* ==========================================
   SOAL 11 - 15
   PILIHAN GANDA
========================================== */

{
    type: "multiple",

    question:
    "Seorang siswa saat upacara terlihat pucat, berkeringat dingin, lemas, dan hampir pingsan. Tindakan awal yang paling tepat adalah...",

    options: [

        "Memaksa siswa tetap berdiri di barisan",

        "Mendampingi siswa keluar dari barisan dan membawa ke UKS atau tempat teduh",

        "Memberikan obat secara langsung",

        "Membiarkan siswa agar segera kuat sendiri",

        "Mengajak semua anggota PMR mengerumuni siswa"

    ],

    answer: 1
},

{
    type: "multiple",

    question:
    "Mengapa tidak semua anggota PMR boleh berlari menuju satu korban ketika ada siswa pingsan?",

    options: [

        "Karena korban harus ditinggalkan sendiri",

        "Agar anggota PMR dapat beristirahat",

        "Karena hanya guru yang boleh mendekati korban",

        "Karena anggota PMR harus tetap menjalankan pembagian tugas dan mengawasi area",

        "Agar upacara segera dihentikan"

    ],

    answer: 3
},

{
    type: "multiple",

    question:
    "Salah satu kondisi yang tepat untuk menggunakan tandu adalah...",

    options: [

        "Korban hanya ingin duduk",

        "Korban masih mampu berjalan dengan baik",

        "Korban mengalami cedera kaki dan tidak dapat berjalan",

        "Korban ingin kembali ke kelas",

        "Korban tidak ingin mengikuti upacara"

    ],

    answer: 2
},

{
    type: "multiple",

    question:
    "Prinsip yang tepat saat membawa korban menggunakan tandu adalah...",

    options: [

        "Berjalan secepat mungkin tanpa aba-aba",

        "Dibawa oleh satu orang agar lebih cepat",

        "Berjalan sambil bercanda agar korban tidak takut",

        "Berjalan sendiri-sendiri tanpa koordinasi",

        "Ada pemimpin aba-aba, komunikasi jelas, dan bergerak perlahan serta hati-hati"

    ],

    answer: 4
},

{
    type: "multiple",

    question:
    "Setelah korban tiba di UKS, tindakan PMR yang paling tepat adalah...",

    options: [

        "Memberikan obat apa saja yang tersedia",

        "Membiarkan korban sendiri",

        "Memaksa korban segera kembali ke kelas",

        "Baringkan korban dengan nyaman, amati kondisi, catat keluhan, dan laporkan kepada guru",

        "Mengambil foto korban untuk dokumentasi pribadi"

    ],

    answer: 3
}

];



/* =========================
   VARIABEL
========================= */

let currentQuestion = 0;

let userAnswers =
new Array(
    questions.length
).fill(null);



/* =========================
   LOAD QUESTION
========================= */

function loadQuestion() {

    const q =
    questions[currentQuestion];


    document
        .getElementById("questionNumber")
        .innerText =
        "SOAL " +
        (currentQuestion + 1) +
        " DARI " +
        questions.length;


    document
        .getElementById("question")
        .innerText =
        q.question;


    const answerArea =
    document
        .getElementById("answerArea");


    answerArea.innerHTML = "";


    resetFeedback();


    if(
        q.type === "truefalse"
    ) {

        createTrueFalseQuestion(
            q,
            answerArea
        );

    }

    else {

        createMultipleChoiceQuestion(
            q,
            answerArea
        );

    }


    updateNavigation();

    updateProgress();

}



/* =========================
   TRUE FALSE QUESTION
========================= */

function createTrueFalseQuestion(
    q,
    answerArea
) {

    const buttons =
    document.createElement("div");


    buttons.className =
    "answer-buttons";


    const trueButton =
    document.createElement("button");


    trueButton.className =
    "answer-btn true-btn";


    trueButton.innerText =
    "✓ BENAR";


    trueButton.onclick =
    function() {

        answerQuestion(
            true,
            q.answer,
            trueButton
        );

    };



    const falseButton =
    document.createElement("button");


    falseButton.className =
    "answer-btn false-btn";


    falseButton.innerText =
    "✕ SALAH";


    falseButton.onclick =
    function() {

        answerQuestion(
            false,
            q.answer,
            falseButton
        );

    };


    buttons.appendChild(
        trueButton
    );


    buttons.appendChild(
        falseButton
    );


    answerArea.appendChild(
        buttons
    );


    if(
        userAnswers[currentQuestion]
        !== null
    ) {

        restoreTrueFalseAnswer(
            q,
            trueButton,
            falseButton
        );

    }

}



/* =========================
   MULTIPLE CHOICE QUESTION
========================= */

function createMultipleChoiceQuestion(
    q,
    answerArea
) {

    const choices =
    document.createElement("div");


    choices.className =
    "multiple-choice";


    const letters =
    ["A", "B", "C", "D", "E"];


    q.options.forEach(
        function(
            option,
            index
        ) {

            const button =
            document.createElement("button");


            button.className =
            "choice-btn";


            button.innerHTML =

            `
            <span class="choice-letter">
                ${letters[index]}
            </span>

            ${option}
            `;


            button.onclick =
            function() {

                answerQuestion(
                    index,
                    q.answer,
                    button
                );

            };


            choices.appendChild(
                button
            );

        }
    );


    answerArea.appendChild(
        choices
    );


    if(
        userAnswers[currentQuestion]
        !== null
    ) {

        restoreMultipleAnswer(
            q,
            choices
        );

    }

}



/* =========================
   ANSWER QUESTION
========================= */

function answerQuestion(
    selectedAnswer,
    correctAnswer,
    selectedButton
) {

    if(
        userAnswers[currentQuestion]
        !== null
    ) {

        return;

    }


    userAnswers[currentQuestion] =
    selectedAnswer;


    const isCorrect =
    selectedAnswer ===
    correctAnswer;


    const allButtons =
    document.querySelectorAll(
        "#answerArea button"
    );


    allButtons.forEach(
        function(button) {

            button.disabled = true;

        }
    );


    if(
        isCorrect
    ) {

        selectedButton.classList.add(
            "correct-choice"
        );

    }

    else {

        selectedButton.classList.add(
            "wrong-choice"
        );


        allButtons.forEach(
            function(
                button,
                index
            ) {

                if(
                    index === correctAnswer
                ) {

                    button.classList.add(
                        "correct-choice"
                    );

                }

            }
        );

    }


    showFeedback(
        isCorrect
    );


    updateProgress();

}



/* =========================
   SHOW FEEDBACK
========================= */

function showFeedback(
    isCorrect
) {

    const feedback =
    document.getElementById(
        "feedback"
    );


    feedback.className =
    "feedback";


    if(
        isCorrect
    ) {

        feedback.classList.add(
            "correct"
        );


        feedback.innerHTML =
        "🎉 BENAR! Jawaban kamu tepat.";

    }

    else {

        feedback.classList.add(
            "wrong"
        );


        feedback.innerHTML =
        "❌ SALAH! Jawaban yang benar ditandai dengan warna hijau.";

    }

}



/* =========================
   RESET FEEDBACK
========================= */

function resetFeedback() {

    const feedback =
    document.getElementById(
        "feedback"
    );


    feedback.className =
    "feedback";


    feedback.innerHTML =
    "";

}



/* =========================
   RESTORE TRUE FALSE
========================= */

function restoreTrueFalseAnswer(
    q,
    trueButton,
    falseButton
) {

    trueButton.disabled =
    true;


    falseButton.disabled =
    true;


    const userAnswer =
    userAnswers[currentQuestion];


    const isCorrect =
    userAnswer ===
    q.answer;


    if(
        userAnswer === true
    ) {

        if(
            isCorrect
        ) {

            trueButton.classList.add(
                "correct-choice"
            );

        }

        else {

            trueButton.classList.add(
                "wrong-choice"
            );

            falseButton.classList.add(
                "correct-choice"
            );

        }

    }

    else {

        if(
            isCorrect
        ) {

            falseButton.classList.add(
                "correct-choice"
            );

        }

        else {

            falseButton.classList.add(
                "wrong-choice"
            );

            trueButton.classList.add(
                "correct-choice"
            );

        }

    }


    showFeedback(
        isCorrect
    );

}



/* =========================
   RESTORE MULTIPLE ANSWER
========================= */

function restoreMultipleAnswer(
    q,
    choices
) {

    const buttons =
    choices.querySelectorAll(
        "button"
    );


    const userAnswer =
    userAnswers[currentQuestion];


    const isCorrect =
    userAnswer ===
    q.answer;


    buttons.forEach(
        function(
            button,
            index
        ) {

            button.disabled =
            true;


            if(
                index === q.answer
            ) {

                button.classList.add(
                    "correct-choice"
                );

            }


            if(
                index === userAnswer &&
                !isCorrect
            ) {

                button.classList.add(
                    "wrong-choice"
                );

            }

        }
    );


    showFeedback(
        isCorrect
    );

}



/* =========================
   NAVIGATION
========================= */

function updateNavigation() {

    const prevButton =
    document.getElementById(
        "prevButton"
    );


    const nextButton =
    document.getElementById(
        "nextButton"
    );


    prevButton.style.visibility =

    currentQuestion === 0

    ?

    "hidden"

    :

    "visible";


    if(
        currentQuestion ===
        questions.length - 1
    ) {

        nextButton.innerText =
        "Selesai & Lihat Hasil";

        nextButton.className =
        "nav-btn submit-btn";

    }

    else {

        nextButton.innerText =
        "Selanjutnya →";

        nextButton.className =
        "nav-btn next-btn";

    }

}



/* =========================
   NEXT QUESTION
========================= */

function nextQuestion() {

    if(
        currentQuestion ===
        questions.length - 1
    ) {

        finishQuiz();

        return;

    }


    currentQuestion++;

    loadQuestion();


    window.scrollTo(
        {
            top: 0,
            behavior: "smooth"
        }
    );

}



/* =========================
   PREVIOUS QUESTION
========================= */

function previousQuestion() {

    if(
        currentQuestion > 0
    ) {

        currentQuestion--;

        loadQuestion();

    }

}



/* =========================
   PROGRESS
========================= */

function updateProgress() {

    const answered =
    userAnswers.filter(
        answer =>
        answer !== null
    ).length;


    const percent =
    Math.round(
        (
            answered /
            questions.length
        ) * 100
    );


    document
        .getElementById("progressText")
        .innerText =

        "Soal " +

        (currentQuestion + 1) +

        " dari " +

        questions.length;


    document
        .getElementById("percentage")
        .innerText =
        percent + "%";


    document
        .getElementById("progressFill")
        .style.width =
        percent + "%";

}



/* =========================
   FINISH QUIZ
========================= */

function finishQuiz() {

    let correctCount =
    0;


    let reviewHTML =
    "";


    questions.forEach(
        function(
            q,
            index
        ) {

            const userAnswer =
            userAnswers[index];


            const isCorrect =

            userAnswer ===
            q.answer;


            if(
                isCorrect
            ) {

                correctCount++;

            }


            let userAnswerText =
            "";


            let correctAnswerText =
            "";


            if(
                q.type === "truefalse"
            ) {

                userAnswerText =

                userAnswer === null

                ?

                "Belum dijawab"

                :

                userAnswer

                ?

                "BENAR"

                :

                "SALAH";


                correctAnswerText =

                q.answer

                ?

                "BENAR"

                :

                "SALAH";

            }

            else {

                userAnswerText =

                userAnswer === null

                ?

                "Belum dijawab"

                :

                q.options[
                    userAnswer
                ];


                correctAnswerText =

                q.options[
                    q.answer
                ];

            }


            reviewHTML +=

            `
            <div
                class="review-item ${
                    isCorrect
                    ?
                    "correct-review"
                    :
                    "wrong-review"
                }"
            >

                <div
                    class="review-question"
                >

                    Soal ${index + 1}

                </div>


                <div
                    class="review-answer"
                >

                    <strong>
                        Pertanyaan:
                    </strong>

                    <br>

                    ${q.question}

                    <br><br>


                    <strong>
                        Jawaban Kamu:
                    </strong>

                    <br>

                    ${userAnswerText}

                    <br><br>


                    <strong>
                        Jawaban Benar:
                    </strong>

                    <br>

                    ${correctAnswerText}

                    <br><br>


                    ${
                        isCorrect

                        ?

                        "✅ Jawaban Benar"

                        :

                        "❌ Jawaban Salah"

                    }

                </div>

            </div>
            `;

        }
    );


    const finalScore =
    Math.round(
        (
            correctCount /
            questions.length
        ) * 100
    );


    document
        .getElementById("score")
        .innerText =
        finalScore;


    let description =
    "";


    if(
        finalScore >= 90
    ) {

        description =
        "🎉 Luar biasa! Kamu sangat memahami materi PMR.";

    }

    else if(
        finalScore >= 75
    ) {

        description =
        "👏 Bagus! Pemahaman kamu terhadap materi PMR sudah baik.";

    }

    else if(
        finalScore >= 60
    ) {

        description =
        "👍 Cukup baik, tetapi masih perlu mempelajari beberapa materi.";

    }

    else {

        description =
        "📚 Yuk pelajari kembali materi PMR dan coba quiz ini lagi.";

    }


    document
        .getElementById("scoreDescription")
        .innerText =
        description;


    document
        .getElementById("review")
        .innerHTML =
        reviewHTML;


    document
        .getElementById("quizCard")
        .style.display =
        "none";


    document
        .getElementById("resultCard")
        .style.display =
        "block";


    window.scrollTo(
        {
            top: 0,
            behavior: "smooth"
        }
    );

}



/* =========================
   RESTART QUIZ
========================= */

function restartQuiz() {

    currentQuestion =
    0;


    userAnswers =
    new Array(
        questions.length
    ).fill(null);


    document
        .getElementById("resultCard")
        .style.display =
        "none";


    document
        .getElementById("quizCard")
        .style.display =
        "block";


    loadQuestion();


    window.scrollTo(
        {
            top: 0,
            behavior: "smooth"
        }
    );

}



/* =========================
   START QUIZ
========================= */

loadQuestion();


</script>
