<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pendaftaran PMR Madya - SMP Negeri 1 Moga</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background:
        linear-gradient(
          135deg,
          #fff5f6,
          #ffffff
        );
      color: #351015;
    }

    .container {
      width: min(100% - 28px, 700px);
      margin: 30px auto 50px;
    }

    .header {
      text-align: center;
      margin-bottom: 22px;
    }

    .logo {
      width: 72px;
      height: 72px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: center;

      background: #bd081c;
      color: white;

      border-radius: 22px;

      font-size: 36px;
      font-weight: 900;

      box-shadow:
        0 12px 30px rgba(189, 8, 28, .22);
    }

    h1 {
      margin: 15px 0 5px;

      font-size: 24px;
      color: #8f0016;
    }

    .subtitle {
      color: #7c666a;
      font-size: 14px;
      line-height: 1.5;
    }

    .card {
      background: white;

      border-radius: 22px;

      padding: 24px;

      box-shadow:
        0 18px 50px rgba(70, 10, 20, .12);

      border:
        1px solid rgba(189, 8, 28, .10);
    }

    .section-title {
      margin: 8px 0 18px;

      font-size: 16px;
      font-weight: 900;

      color: #bd081c;

      padding-bottom: 9px;

      border-bottom:
        2px solid #f5d9dc;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;

      margin-bottom: 7px;

      font-size: 13px;

      font-weight: 800;

      color: #4b292e;
    }

    input,
    select,
    textarea {
      width: 100%;

      padding: 12px 13px;

      border:
        1px solid #e5cfd2;

      border-radius: 11px;

      background: #fff;

      font-size: 14px;

      outline: none;

      transition: .2s;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #bd081c;

      box-shadow:
        0 0 0 3px rgba(189, 8, 28, .08);
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .grid {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 14px;
    }

    .photo-box {
      border:
        2px dashed #e5bfc4;

      border-radius: 15px;

      padding: 18px;

      text-align: center;

      background: #fffafa;
    }

    .preview {
      display: none;

      width: 130px;
      height: 170px;

      margin: 12px auto 0;

      object-fit: cover;

      border-radius: 12px;

      border:
        4px solid #bd081c;

      box-shadow:
        0 8px 20px rgba(0,0,0,.12);
    }

    .photo-note {
      margin-top: 8px;

      color: #8a7075;

      font-size: 11px;

      line-height: 1.5;
    }

    .submit-btn {
      width: 100%;

      margin-top: 10px;

      padding: 14px;

      border: none;

      border-radius: 13px;

      background:
        linear-gradient(
          135deg,
          #8f0016,
          #bd081c,
          #e1273d
        );

      color: white;

      font-size: 15px;

      font-weight: 900;

      cursor: pointer;

      box-shadow:
        0 10px 25px rgba(189, 8, 28, .20);
    }

    .submit-btn:disabled {
      opacity: .6;
      cursor: wait;
    }

    .search-link {
      display: block;

      margin-top: 18px;

      text-align: center;

      color: #bd081c;

      font-size: 13px;

      font-weight: 800;

      text-decoration: none;
    }

    .message {
      display: none;

      margin-bottom: 18px;

      padding: 13px;

      border-radius: 11px;

      font-size: 13px;

      line-height: 1.5;
    }

    .message.success {
      display: block;

      background: #edf9f0;

      color: #17672a;

      border: 1px solid #bfe4c7;
    }

    .message.error {
      display: block;

      background: #fff0f1;

      color: #9b1422;

      border: 1px solid #efc0c5;
    }

    .required {
      color: #bd081c;
    }

    @media (max-width: 560px) {

      .container {
        margin-top: 18px;
      }

      .card {
        padding: 18px;
      }

      .grid {
        grid-template-columns: 1fr;
        gap: 0;
      }

      h1 {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">

    <div class="logo">
      ✚
    </div>

    <h1>
      PENDAFTARAN PMR MADYA
    </h1>

    <div class="subtitle">
      SMP NEGERI 1 MOGA<br>
      Palang Merah Indonesia
    </div>

  </div>


  <div class="card">

    <div id="message" class="message"></div>


    <form id="registrationForm">

      <div class="section-title">
        DATA DIRI ANGGOTA
      </div>


      <div class="form-group">

        <label>
          Nama Lengkap <span class="required">*</span>
        </label>

        <input
          type="text"
          id="NAMA_LENGKAP"
          required
          autocomplete="name"
          placeholder="Masukkan nama lengkap"
        >

      </div>


      <div class="grid">

        <div class="form-group">

          <label>
            Jenis Kelamin
          </label>

          <select id="JENIS_KELAMIN">

            <option value="">
              Pilih
            </option>

            <option value="Laki-laki">
              Laki-laki
            </option>

            <option value="Perempuan">
              Perempuan
            </option>

          </select>

        </div>


        <div class="form-group">

          <label>
            Kelas
          </label>

          <input
            type="text"
            id="KELAS"
            placeholder="Contoh: 9I"
          >

        </div>

      </div>


      <div class="grid">

        <div class="form-group">

          <label>
            Tempat Lahir
          </label>

          <input
            type="text"
            id="TEMPAT_LAHIR"
            placeholder="Tempat lahir"
          >

        </div>


        <div class="form-group">

          <label>
            Tanggal Lahir
          </label>

          <input
            type="date"
            id="TANGGAL_LAHIR"
          >

        </div>

      </div>


      <div class="grid">

        <div class="form-group">

          <label>
            Agama
          </label>

          <select id="AGAMA">

            <option value="">
              Pilih agama
            </option>

            <option>Islam</option>
            <option>Kristen</option>
            <option>Katolik</option>
            <option>Hindu</option>
            <option>Buddha</option>
            <option>Konghucu</option>

          </select>

        </div>


        <div class="form-group">

          <label>
            Golongan Darah
          </label>

          <select id="GOLONGAN_DARAH">

            <option value="">
              Pilih
            </option>

            <option>A</option>
            <option>B</option>
            <option>AB</option>
            <option>O</option>
            <option>Tidak tahu</option>

          </select>

        </div>

      </div>


      <div class="form-group">

        <label>
          NISN <span class="required">*</span>
        </label>

        <input
          type="text"
          id="NISN"
          inputmode="numeric"
          pattern="[0-9]+"
          required
          placeholder="Masukkan NISN"
        >

      </div>


      <div class="form-group">

        <label>
          Nomor HP
        </label>

        <input
          type="tel"
          id="NO_HP"
          placeholder="Nomor HP"
        >

      </div>


      <div class="form-group">

        <label>
          Hobi
        </label>

        <input
          type="text"
          id="HOBI"
          placeholder="Contoh: olahraga, membaca"
        >

      </div>


      <div class="form-group">

        <label>
          Alamat
        </label>

        <textarea
          id="ALAMAT"
          placeholder="Alamat lengkap"
        ></textarea>

      </div>


      <div class="section-title">
        FOTO ANGGOTA
      </div>


      <div class="photo-box">

        <input
          type="file"
          id="FOTO"
          accept="image/*"
          required
        >

        <div class="photo-note">
          Gunakan foto terbaru dengan wajah terlihat jelas.
          Format JPG/PNG/WebP.
        </div>

        <img
          id="preview"
          class="preview"
          alt="Preview foto"
        >

      </div>


      <button
        type="submit"
        id="submitButton"
        class="submit-btn"
      >
        DAFTAR SEBAGAI ANGGOTA PMR
      </button>

    </form>


    <a
      class="search-link"
      href="search.html"
    >
      🔎 Sudah terdaftar? Cari KTA Anda
    </a>

  </div>

</div>


<script>

  /*
   * API GOOGLE APPS SCRIPT
   */
  const API_URL =
    'https://script.google.com/macros/s/AKfycbwlh56TBt1I1DK8M2rkdvQKFZXwWgTyTqOD9opCf8PjKTyHTsEWMKzhFwcSiK9xJ2OFWw/exec';


  const form =
    document.getElementById(
      'registrationForm'
    );

  const fotoInput =
    document.getElementById(
      'FOTO'
    );

  const preview =
    document.getElementById(
      'preview'
    );

  const message =
    document.getElementById(
      'message'
    );

  const submitButton =
    document.getElementById(
      'submitButton'
    );


  /*
   * Preview foto
   */

  fotoInput.addEventListener(
    'change',
    function () {

      const file =
        this.files[0];

      if (!file) {

        preview.style.display =
          'none';

        return;

      }

      if (
        !file.type.startsWith(
          'image/'
        )
      ) {

        showMessage(
          'File yang dipilih bukan gambar.',
          'error'
        );

        this.value = '';

        return;

      }


      const reader =
        new FileReader();


      reader.onload =
        function (event) {

          preview.src =
            event.target.result;

          preview.style.display =
            'block';

        };


      reader.readAsDataURL(
        file
      );

    }
  );


  /*
   * Submit
   */

  form.addEventListener(
    'submit',
    async function (event) {

      event.preventDefault();


      hideMessage();


      const file =
        fotoInput.files[0];


      if (!file) {

        showMessage(
          'Foto anggota wajib diunggah.',
          'error'
        );

        return;

      }


      const nisn =
        document
          .getElementById('NISN')
          .value
          .trim();


      if (
        !/^\d+$/.test(nisn)
      ) {

        showMessage(
          'NISN harus berupa angka.',
          'error'
        );

        return;

      }


      submitButton.disabled =
        true;

      submitButton.textContent =
        'MEMPROSES PENDAFTARAN...';


      try {

        /*
         * Baca foto sebagai Data URL
         */

        const fotoData =
          await readFileAsDataURL(
            file
          );


        const data = {

          action:
            'registerMember',

          NAMA_LENGKAP:
            getValue(
              'NAMA_LENGKAP'
            ),

          JENIS_KELAMIN:
            getValue(
              'JENIS_KELAMIN'
            ),

          TEMPAT_LAHIR:
            getValue(
              'TEMPAT_LAHIR'
            ),

          TANGGAL_LAHIR:
            getValue(
              'TANGGAL_LAHIR'
            ),

          AGAMA:
            getValue(
              'AGAMA'
            ),

          ALAMAT:
            getValue(
              'ALAMAT'
            ),

          NO_HP:
            getValue(
              'NO_HP'
            ),

          HOBI:
            getValue(
              'HOBI'
            ),

          GOLONGAN_DARAH:
            getValue(
              'GOLONGAN_DARAH'
            ),

          KELAS:
            getValue(
              'KELAS'
            ),

          NISN:
            nisn,

          FOTO:
            fotoData,

          FOTO_MIME:
            file.type ||
            'image/jpeg',

          FOTO_NAMA_FILE:
            file.name

        };


        /*
         * Kirim ke Apps Script
         */

        const response =
          await fetch(
            API_URL,
            {
              method: 'POST',

              body:
                JSON.stringify(
                  data
                )
            }
          );


        const result =
          await response.json();


        if (
          !result.success
        ) {

          throw new Error(
            result.message ||
            'Pendaftaran gagal.'
          );

        }


        showMessage(
          'Pendaftaran berhasil dikirim. ' +
          'Silakan menunggu validasi admin sebelum KTA dapat digunakan.',
          'success'
        );


        form.reset();

        preview.src = '';

        preview.style.display =
          'none';


        window.scrollTo({
          top: 0,
          behavior: 'smooth'
        });


      } catch (error) {

        console.error(
          error
        );


        showMessage(
          error.message ||
          'Pendaftaran gagal diproses.',
          'error'
        );

      } finally {

        submitButton.disabled =
          false;

        submitButton.textContent =
          'DAFTAR SEBAGAI ANGGOTA PMR';

      }

    }
  );


  function getValue(
    id
  ) {

    return document
      .getElementById(id)
      .value
      .trim();

  }


  function readFileAsDataURL(
    file
  ) {

    return new Promise(
      function (
        resolve,
        reject
      ) {

        const reader =
          new FileReader();


        reader.onload =
          function () {

            resolve(
              reader.result
            );

          };


        reader.onerror =
          function () {

            reject(
              new Error(
                'Foto tidak dapat dibaca.'
              )
            );

          };


        reader.readAsDataURL(
          file
        );

      }
    );

  }


  function showMessage(
    text,
    type
  ) {

    message.textContent =
      text;

    message.className =
      'message ' +
      type;

  }


  function hideMessage() {

    message.textContent =
      '';

    message.className =
      'message';

  }

</script>

</body>
</html>
