<style>

  /* =========================================================
     KTA CARD
  ========================================================= */

  .kta-stage {
    width: 100%;
    display: flex;
    justify-content: center;
    padding: 12px 0 22px;
  }


  .kta-card {
    position: relative;

    width: min(100%, 360px);

    aspect-ratio: 5.513 / 8.72;

    overflow: hidden;

    border-radius: 20px;

    background:
      linear-gradient(
        155deg,
        #ffffff 0%,
        #fff8f8 45%,
        #fce5e7 100%
      );

    box-shadow:
      0 20px 50px rgba(65, 10, 18, .22);

    border:
      1px solid rgba(189, 8, 28, .16);
  }


  /* =========================================================
     TOP MERAH
  ========================================================= */

  .kta-top {
    position: absolute;

    left: 0;
    right: 0;
    top: 0;

    height: 18.5%;

    background:
      linear-gradient(
        135deg,
        #8f0016 0%,
        #bd081c 55%,
        #e1273d 100%
      );

    clip-path:
      polygon(
        0 0,
        100% 0,
        100% 77%,
        50% 100%,
        0 77%
      );
  }


  /* =========================================================
     ORGANISASI
  ========================================================= */

  .kta-org {
    position: absolute;

    top: 4.5%;

    left: 8%;
    right: 8%;

    z-index: 5;

    color: white;

    text-align: center;

    font-size: 9px;

    line-height: 1.25;

    font-weight: 800;

    letter-spacing: .1px;
  }


  .kta-org strong {
    display: block;

    font-size: 11px;

    font-weight: 900;

    letter-spacing: .15px;
  }


  .kta-cross {
    width: 24px;
    height: 24px;

    margin: 5px auto 0;

    display: flex;
    align-items: center;
    justify-content: center;

    background: white;

    border-radius: 7px;

    color: #bd081c;

    font-size: 16px;

    font-weight: 900;

    box-shadow:
      0 3px 10px rgba(0,0,0,.10);
  }


  /* =========================================================
     FOTO
     DITURUNKAN AGAR LEBIH PROPORSIONAL
  ========================================================= */

  .kta-photo-wrap {
    position: absolute;

    z-index: 4;

    top: 22%;

    left: 50%;

    transform: translateX(-50%);

    width: 43%;

    aspect-ratio: 3 / 4;

    padding: 4px;

    border-radius: 14px;

    background:
      linear-gradient(
        145deg,
        #8f0016,
        #e1263d
      );

    box-shadow:
      0 9px 22px rgba(80,0,15,.20);
  }


  .kta-photo {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;

    object-position: center center;

    border-radius: 10px;

    background: #eeeeee;
  }


  /* =========================================================
     BODY / NAMA
  ========================================================= */

  .kta-body {
    position: absolute;

    z-index: 5;

    left: 7%;
    right: 7%;

    top: 55.5%;

    text-align: center;
  }


  .kta-label {
    font-size: 8px;

    text-transform: uppercase;

    letter-spacing: 1.6px;

    color: #9c7b80;

    font-weight: 900;
  }


  .kta-name {
    margin-top: 5px;

    font-size: clamp(
      14px,
      4vw,
      19px
    );

    line-height: 1.15;

    color: #3b1117;

    font-weight: 900;

    word-break: break-word;

    text-transform: uppercase;
  }


  .kta-number {
    display: inline-flex;

    align-items: center;
    justify-content: center;

    margin-top: 9px;

    padding: 6px 12px;

    min-height: 25px;

    border-radius: 99px;

    background: white;

    border:
      1px solid #f0c6cb;

    color: #bd081c;

    font-size: 9px;

    font-weight: 900;

    letter-spacing: .5px;
  }


  /* =========================================================
     FOOTER
  ========================================================= */

  .kta-bottom {
    position: absolute;

    z-index: 5;

    left: 7%;
    right: 7%;

    bottom: 6%;

    display: flex;

    align-items: center;

    gap: 10px;

    padding-top: 9px;

    border-top:
      1px solid rgba(189,8,28,.14);
  }


  .kta-qr {
    display: block;

    width: 23%;

    aspect-ratio: 1;

    object-fit: contain;

    background: white;

    padding: 3px;

    border-radius: 7px;

    border:
      1px solid #ead1d4;
  }


  .kta-footer-info {
    flex: 1;

    text-align: left;
  }


  .kta-position {
    color: #bd081c;

    font-size: 10px;

    font-weight: 900;
  }


  .kta-school {
    margin-top: 3px;

    font-size: 8px;

    line-height: 1.35;

    font-weight: 800;

    color: #44252a;
  }


  .kta-location {
    margin-top: 2px;

    font-size: 7px;

    color: #8a6d71;
  }


  /* =========================================================
     MOBILE
  ========================================================= */

  @media (max-width: 520px) {

    .kta-card {
      width: min(100%, 330px);

      border-radius: 18px;
    }

    .kta-photo-wrap {
      top: 22%;
      width: 43%;
    }

    .kta-body {
      top: 55.5%;
    }

  }


  /* =========================================================
     VERY SMALL
  ========================================================= */

  @media (max-width: 360px) {

    .kta-card {
      width: 285px;
    }

  }


  /* =========================================================
     PRINT
  ========================================================= */

  @media print {

    .kta-stage {
      padding: 0;
    }

    .kta-card {

      width: 5.513cm;

      height: 8.72cm;

      aspect-ratio: auto;

      border-radius: .35cm;

      box-shadow: none;

      border: none;
    }

  }

</style>


<!-- =========================================================
     KTA CARD
========================================================= -->
